<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.9" fill="#99A19B" opacity="0.4"/>
    </pattern>
    <pattern id="railTie" width="16" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="5" width="12" height="30" fill="#6E5E52" rx="1"/>
      <line x1="0" y1="12" x2="16" y2="12" stroke="#4F5752" stroke-width="2"/>
      <line x1="0" y1="28" x2="16" y2="28" stroke="#4F5752" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="800" fill="#F6F7F5"/>
  <rect width="1200" height="800" fill="url(#dotGrid)"/>

  <!-- Border & Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#D5DAD3" stroke-width="1"/>
  
  <!-- Technical Labels -->
  <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#2D4436" letter-spacing="2">PROJEKT 02 // GRÜNER KORRIDOR &amp; STADTVERNETZUNG</text>
  <text x="50" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6A736E" letter-spacing="1">EHEMALIGES BAHN- &amp; GÜTERAREAL // FREIRAUM- &amp; WEGEVERNETZUNG // M 1:500</text>
  
  <text x="1050" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2D4436" text-anchor="end" letter-spacing="1">MOOSBURG / FREISING</text>
  <text x="1050" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6A736E" text-anchor="end">VECTORWORKS CAD // 2024</text>

  <!-- Axonometric / Diagonal Spatial Structure -->
  <!-- Industrial Concrete Slab / Former Depot Platform -->
  <polygon points="120,480 500,280 1020,380 640,580" fill="#E2E4DF" stroke="#87918A" stroke-width="1.2"/>
  
  <!-- Railway Tracks (Decaying / Reclaimed) -->
  <path d="M 80,680 L 480,480 L 1100,600" stroke="#756A63" stroke-width="4" stroke-dasharray="14 10" fill="none"/>
  <path d="M 95,690 L 495,490 L 1115,610" stroke="#756A63" stroke-width="4" stroke-dasharray="14 10" fill="none"/>

  <!-- Linear Pioneer Park Green Corridor Ribbon -->
  <path d="M 180,620 Q 420,440 680,470 T 1140,430 L 1140,510 Q 720,530 460,540 T 180,680 Z" fill="#CCD8CA" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.5"/>

  <!-- Rust-Steel (Corten) Ribbon / Path -->
  <path d="M 160,550 C 350,420 540,500 820,420 C 950,380 1040,400 1120,370" fill="none" stroke="#9E5B3D" stroke-width="5" stroke-linecap="round"/>
  <text x="760" y="445" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9E5B3D" letter-spacing="1">CORTENSTAHL-STEG (BARRIEREFREI)</text>

  <!-- Birch Grove (Betula pendula) Clustered Planting -->
  <g transform="translate(320, 360)">
    <circle cx="0" cy="0" r="32" fill="#AFC4AD" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.2"/>
    <circle cx="28" cy="-15" r="24" fill="#BFD2BD" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.2"/>
    <circle cx="-20" cy="20" r="22" fill="#AFC4AD" fill-opacity="0.5" stroke="#2D4436" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="18" fill="#D3E0D1" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.2"/>
    <text x="10" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">BETULA PENDULA HAIN</text>
  </g>

  <!-- Ruderal Meadow / Trockenrasen Polygon -->
  <polygon points="560,340 760,270 890,320 690,390" fill="#DFE8DC" stroke="#4C6856" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="720" y="335" font-family="'JetBrains Mono', monospace" font-size="8" fill="#4C6856" text-anchor="middle">MAGERRASEN-PLATEAU</text>

  <!-- Re-purposed Industrial Signal Box (Subtle Modern Pavilion) -->
  <polygon points="820,240 890,200 950,220 880,260" fill="#3D4540" stroke="#1A1F1B" stroke-width="1.5"/>
  <polygon points="820,240 880,260 880,310 820,290" fill="#2A302C"/>
  <polygon points="880,260 950,220 950,270 880,310" fill="#525C56"/>
  <text x="890" y="185" font-family="'JetBrains Mono', monospace" font-size="8" fill="#141615" text-anchor="middle">EHEM. STELLWERK // INFO-PAVILLON</text>

  <!-- Key Metrics Box (Editorial Style) -->
  <rect x="50" y="650" width="280" height="75" fill="#FFFFFF" stroke="#D5DAD3" stroke-width="1"/>
  <text x="65" y="672" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#141615">FLÄCHE: 42.000 m²</text>
  <text x="65" y="690" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6A736E">ENTSCHIEGELUNG: 74 %</text>
  <text x="65" y="706" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6A736E">ARTENSCHUTZ: BLAUFLÜGELIGE ÖDLANDSCHRECKE</text>

  <!-- North Arrow -->
  <g transform="translate(1100, 715)">
    <polygon points="0,-25 6,0 0,-5 -6,0" fill="#2D4436"/>
    <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#2D4436" text-anchor="middle">N</text>
  </g>
</svg>
