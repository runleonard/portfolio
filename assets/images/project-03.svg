<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <pattern id="pavingGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#F0F2EF" stroke="#DCE1DA" stroke-width="0.75"/>
      <rect x="0" y="0" width="15" height="15" fill="#EAECE8" stroke="#DCE1DA" stroke-width="0.5"/>
      <rect x="15" y="15" width="15" height="15" fill="#EAECE8" stroke="#DCE1DA" stroke-width="0.5"/>
    </pattern>
    <pattern id="diagonalSwale" width="12" height="12" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3D5F4D" stroke-width="1.2" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="800" fill="#F8F9F7"/>

  <!-- Paved Square Grid / Agora -->
  <rect x="100" y="140" width="1000" height="520" fill="url(#pavingGrid)" stroke="#CBD2C9" stroke-width="1"/>

  <!-- Surrounding Context Outline -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#D5DAD3" stroke-width="1"/>
  
  <!-- Technical Labels -->
  <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#2D4436" letter-spacing="2">PROJEKT 03 // FREIRAUMSTUDIE &amp; ISARRAUM-ANALYSE</text>
  <text x="50" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6A736E" letter-spacing="1">SEMESTER 2 // BESTANDSKARTIERUNG &amp; GRÜNRAUMKORRIDOR // M 1:500</text>
  
  <text x="1050" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2D4436" text-anchor="end" letter-spacing="1">MOOSBURG A. D. ISAR</text>
  <text x="1050" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6A736E" text-anchor="end">VECTORWORKS CAD // 2024</text>

  <!-- Central Sunken Bioswale / Versickerungsmulde -->
  <path d="M 280,240 Q 550,200 800,280 Q 940,330 960,450 Q 860,560 620,530 Q 320,580 240,440 Q 200,320 280,240 Z" fill="#D7E4D4" stroke="#2D4436" stroke-width="1.6"/>
  <path d="M 320,270 Q 550,240 760,300 Q 880,350 900,430 Q 820,510 600,490 Q 350,530 280,420 Q 250,330 320,270 Z" fill="url(#diagonalSwale)"/>

  <!-- Water Flow Arrows (Infiltration Stream) -->
  <path d="M 340,310 C 500,280 660,320 800,380" fill="none" stroke="#376850" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="805,382 795,375 798,385" fill="#376850"/>
  <text x="540" y="300" font-family="'JetBrains Mono', monospace" font-size="9" fill="#376850">VERSICKERUNGSRINNE (OFFEN)</text>

  <!-- Climate Tree Canopy Grid (Zelkova serrata) -->
  <g transform="translate(200, 220)">
    <circle cx="0" cy="0" r="38" fill="#B4C7B1" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4" fill="#2D4436"/>
    <text x="0" y="-45" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">ZELKOVA SERRATA #01</text>
  </g>
  <g transform="translate(420, 180)">
    <circle cx="0" cy="0" r="42" fill="#B4C7B1" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4" fill="#2D4436"/>
    <text x="0" y="-48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">ZELKOVA SERRATA #02</text>
  </g>
  <g transform="translate(680, 190)">
    <circle cx="0" cy="0" r="40" fill="#B4C7B1" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4" fill="#2D4436"/>
    <text x="0" y="-46" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">ZELKOVA SERRATA #03</text>
  </g>
  <g transform="translate(1000, 260)">
    <circle cx="0" cy="0" r="44" fill="#B4C7B1" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4" fill="#2D4436"/>
    <text x="0" y="-50" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">ZELKOVA SERRATA #04</text>
  </g>
  
  <g transform="translate(260, 580)">
    <circle cx="0" cy="0" r="36" fill="#C4D5C2" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4" fill="#2D4436"/>
  </g>
  <g transform="translate(520, 600)">
    <circle cx="0" cy="0" r="42" fill="#C4D5C2" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4" fill="#2D4436"/>
  </g>
  <g transform="translate(860, 580)">
    <circle cx="0" cy="0" r="40" fill="#C4D5C2" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4" fill="#2D4436"/>
  </g>

  <!-- Architectural Concrete Benches (Sitzstufen) -->
  <rect x="420" y="440" width="180" height="14" fill="#6A736D" stroke="#2A332C" stroke-width="1"/>
  <rect x="420" y="454" width="180" height="14" fill="#88928B" stroke="#2A332C" stroke-width="1"/>
  <rect x="420" y="468" width="180" height="14" fill="#A8B2AB" stroke="#2A332C" stroke-width="1"/>
  <text x="510" y="432" font-family="'JetBrains Mono', monospace" font-size="8" fill="#141615" text-anchor="middle">SITZSTUFEN AUS ENTWÄSSERUNGSBETON</text>

  <!-- Technical Dimension Lines (Koten & Vermaßung) -->
  <line x1="100" y1="690" x2="1100" y2="690" stroke="#141615" stroke-width="0.8"/>
  <line x1="100" y1="682" x2="100" y2="698" stroke="#141615" stroke-width="1.2"/>
  <line x1="1100" y1="682" x2="1100" y2="698" stroke="#141615" stroke-width="1.2"/>
  <text x="600" y="705" font-family="'JetBrains Mono', monospace" font-size="9" fill="#141615" text-anchor="middle">75.00 m GESAMTLÄNGE AGORA</text>
</svg>
