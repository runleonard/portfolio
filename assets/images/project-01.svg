<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#406352" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2D4436" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="gravelPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#717A74" opacity="0.4"/>
      <circle cx="14" cy="12" r="1.5" fill="#717A74" opacity="0.3"/>
      <circle cx="8" cy="16" r="0.8" fill="#717A74" opacity="0.5"/>
    </pattern>
    <pattern id="hatchPattern" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2D4436" stroke-width="0.75" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="#F4F5F3"/>
  <rect width="1200" height="800" fill="url(#hatchPattern)"/>

  <!-- Architectural Frame & Registration Marks -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#D3D7D2" stroke-width="1"/>
  
  <!-- Technical Legend / Header -->
  <text x="50" y="70" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#2D4436" letter-spacing="2">PROJEKT 01 // STÄDTEBAULICHER SCHNITT &amp; QUARTIERSSTRUKTUR</text>
  <text x="50" y="92" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" fill="#6A736E" letter-spacing="1">KLIMARESILIENTES WOHNQUARTIER // DICHTE &amp; DURCHGRÜNUNG // M 1:250</text>
  
  <text x="1050" y="70" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#2D4436" text-anchor="end" letter-spacing="1">MÜNCHEN / FREISING</text>
  <text x="1050" y="92" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" fill="#6A736E" text-anchor="end">VECTORWORKS CAD // 2025</text>

  <!-- Terrain & Geotechnical Profile -->
  <!-- Deep bedrock -->
  <path d="M 50,680 L 1150,680 L 1150,620 Q 950,610 800,580 T 500,530 T 250,560 T 50,600 Z" fill="#E6E9E4" stroke="#BDC4BC" stroke-width="1"/>
  <rect x="50" y="600" width="1100" height="80" fill="url(#gravelPattern)"/>

  <!-- Topsoil & Soft Landscape -->
  <path d="M 50,580 Q 200,540 320,550 T 520,490 T 700,520 T 920,440 T 1150,470 L 1150,620 Q 950,610 800,580 T 500,530 T 250,560 T 50,600 Z" fill="#DDE3DB" stroke="#2D4436" stroke-width="1.8"/>

  <!-- River Bed / Isar Water Body -->
  <path d="M 300,550 C 380,555 420,570 480,570 C 540,570 570,555 640,530 C 580,510 490,495 410,510 Z" fill="url(#waterGrad)" stroke="#3A5C4A" stroke-width="1.5"/>
  
  <!-- Water Level Annotation -->
  <line x1="280" y1="520" x2="660" y2="520" stroke="#3A5C4A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="670" y="524" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3A5C4A">MW +512.40 (MITTLERES WASSER)</text>
  
  <!-- High Water Mark HQ100 -->
  <line x1="160" y1="470" x2="880" y2="470" stroke="#B35446" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="890" y="474" font-family="'JetBrains Mono', monospace" font-size="9" fill="#B35446">HQ 100 +515.80 (EXTREMHOCHWASSER)</text>

  <!-- Architectural Vegetation / Trees (Editorial Outline & Stipple) -->
  <!-- Tree 1 (Salix alba / Silberweide) -->
  <g transform="translate(220, 430)">
    <line x1="0" y1="120" x2="0" y2="40" stroke="#2D4436" stroke-width="2"/>
    <circle cx="0" cy="20" r="55" fill="#C8D4C5" fill-opacity="0.6" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="15" cy="5" r="35" fill="#B7C7B3" fill-opacity="0.4" stroke="#2D4436" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="0" y="-45" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">SALIX ALBA</text>
  </g>

  <!-- Tree 2 (Alnus glutinosa / Schwarzerle) -->
  <g transform="translate(760, 390)">
    <line x1="0" y1="130" x2="0" y2="35" stroke="#2D4436" stroke-width="2"/>
    <circle cx="0" cy="15" r="48" fill="#B7C7B3" fill-opacity="0.5" stroke="#2D4436" stroke-width="1.4"/>
    <circle cx="-10" cy="0" r="28" fill="#9FB59B" fill-opacity="0.4" stroke="#2D4436" stroke-width="0.8"/>
    <text x="0" y="-42" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">ALNUS GLUTINOSA</text>
  </g>

  <!-- Tree 3 (Populus nigra / Schwarzpappel) -->
  <g transform="translate(1000, 340)">
    <line x1="0" y1="130" x2="0" y2="40" stroke="#2D4436" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="42" ry="60" fill="#D0DDD0" fill-opacity="0.5" stroke="#2D4436" stroke-width="1.4"/>
    <text x="0" y="-60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">POPULUS NIGRA</text>
  </g>

  <!-- Timber Steg / Boardwalk Elevation -->
  <rect x="700" y="470" width="160" height="6" fill="#42342A"/>
  <line x1="720" y1="476" x2="720" y2="520" stroke="#42342A" stroke-width="2.5"/>
  <line x1="760" y1="476" x2="760" y2="525" stroke="#42342A" stroke-width="2.5"/>
  <line x1="800" y1="476" x2="800" y2="515" stroke="#42342A" stroke-width="2.5"/>
  <line x1="840" y1="476" x2="840" y2="500" stroke="#42342A" stroke-width="2.5"/>
  <text x="780" y="460" font-family="'JetBrains Mono', monospace" font-size="8" fill="#42342A" text-anchor="middle">HOLZSTEG AUF STAHLJALOUSIEN</text>

  <!-- People Silhouettes / Maßstabsfiguren -->
  <g transform="translate(740, 442)">
    <circle cx="0" cy="4" r="2.5" fill="#141615"/>
    <line x1="0" y1="6.5" x2="0" y2="24" stroke="#141615" stroke-width="1.5"/>
    <line x1="0" y1="24" x2="-2" y2="28" stroke="#141615" stroke-width="1.2"/>
    <line x1="0" y1="24" x2="2" y2="28" stroke="#141615" stroke-width="1.2"/>
  </g>
  <g transform="translate(752, 444)">
    <circle cx="0" cy="4" r="2.5" fill="#141615"/>
    <line x1="0" y1="6.5" x2="0" y2="22" stroke="#141615" stroke-width="1.5"/>
  </g>

  <!-- Scale Bar & North Arrow at Bottom -->
  <g transform="translate(50, 725)">
    <rect x="0" y="0" width="30" height="4" fill="#141615"/>
    <rect x="30" y="0" width="30" height="4" fill="#FFFFFF" stroke="#141615" stroke-width="0.8"/>
    <rect x="60" y="0" width="30" height="4" fill="#141615"/>
    <rect x="90" y="0" width="30" height="4" fill="#FFFFFF" stroke="#141615" stroke-width="0.8"/>
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#141615">0</text>
    <text x="30" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#141615">5m</text>
    <text x="60" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#141615">10m</text>
    <text x="120" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#141615">20m</text>
  </g>
</svg>
