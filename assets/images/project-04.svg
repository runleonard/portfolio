<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBECE8"/>
      <stop offset="100%" stop-color="#D7DCD5"/>
    </linearGradient>
    <pattern id="contourHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#7A857E" stroke-width="0.75" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="800" fill="#F7F8F6"/>

  <!-- Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#D3D8D1" stroke-width="1"/>
  
  <!-- Technical Labels -->
  <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#2D4436" letter-spacing="2">PROJEKT 04 // GESTALTUNGSLEHRE &amp; TOPOGRAPHISCHES RELIEF</text>
  <text x="50" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6A736E" letter-spacing="1">SEMESTER 1 // SCHICHTUNG, MODELLSTUDIE &amp; RAUM // M 1:100</text>
  
  <text x="1050" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2D4436" text-anchor="end" letter-spacing="1">HSWT FREISING</text>
  <text x="1050" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6A736E" text-anchor="end">MODELLBAU &amp; CAD // 2023</text>

  <!-- Topographic Contour Terraces (Stepped Landform / Schichtstufen) -->
  <!-- Tier 1: Base Plateau -->
  <path d="M 80,680 L 1120,680 L 1120,580 Q 820,560 600,600 Q 350,640 80,590 Z" fill="#DDE2DA" stroke="#2D4436" stroke-width="1.5"/>
  <text x="110" y="650" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58635B">+412.00 SOHLE</text>

  <!-- Tier 2: Lower Terrace -->
  <path d="M 120,590 Q 380,630 620,590 Q 820,550 1080,570 L 1050,480 Q 750,460 520,500 Q 300,530 120,510 Z" fill="#E4E9E1" stroke="#2D4436" stroke-width="1.5"/>
  <text x="140" y="555" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58635B">+416.50 PLATEAU I</text>

  <!-- Tier 3: Intermediate Cut -->
  <path d="M 160,500 Q 320,520 540,490 Q 760,450 1020,470 L 980,390 Q 700,370 480,410 Q 280,440 160,420 Z" fill="#ECF0E9" stroke="#2D4436" stroke-width="1.5"/>
  <text x="180" y="465" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58635B">+421.00 PLATEAU II</text>

  <!-- Tier 4: Upper Quarry Cliff (Kalkstein-Bruchkante) -->
  <path d="M 200,410 Q 300,430 500,400 Q 720,360 950,380 L 920,290 Q 640,270 420,310 Q 260,330 200,310 Z" fill="#F2F5F0" stroke="#2D4436" stroke-width="2"/>
  <text x="220" y="365" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2D4436" font-weight="600">+428.00 BRUCHKANTE</text>

  <!-- Natural Cliff Geological Fissures (Klüfte / Geologisches Profil) -->
  <path d="M 380,310 L 375,410 M 520,300 L 515,400 M 680,280 L 675,370 M 820,290 L 815,380" stroke="#728076" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Minimalist Stairway cut into Stone (Inzision / Rampe) -->
  <polygon points="560,590 600,590 610,390 570,390" fill="#2D4436" opacity="0.85"/>
  <line x1="565" y1="550" x2="605" y2="550" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="568" y1="510" x2="608" y2="510" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="570" y1="470" x2="610" y2="470" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="570" y1="430" x2="610" y2="430" stroke="#FFFFFF" stroke-width="1"/>
  <text x="630" y="495" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436">RAMPENSCHNITT (STUFENLOSE ERSCHLIESSUNG)</text>

  <!-- Dry Grassland Texture & Pine Clumps (Pinus mugo / Wacholder) -->
  <g transform="translate(860, 420)">
    <circle cx="0" cy="0" r="16" fill="#9FB599" fill-opacity="0.7" stroke="#2D4436" stroke-width="1"/>
    <circle cx="18" cy="6" r="12" fill="#8EA588" fill-opacity="0.7" stroke="#2D4436" stroke-width="1"/>
    <text x="8" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">JUNIPERUS COMMUNIS</text>
  </g>
  <g transform="translate(340, 450)">
    <circle cx="0" cy="0" r="14" fill="#9FB599" fill-opacity="0.7" stroke="#2D4436" stroke-width="1"/>
  </g>

  <!-- Solitary Oak on Top Horizon -->
  <g transform="translate(760, 240)">
    <line x1="0" y1="40" x2="0" y2="10" stroke="#2D4436" stroke-width="2"/>
    <circle cx="0" cy="-5" r="32" fill="#B4C7B1" fill-opacity="0.7" stroke="#2D4436" stroke-width="1.4"/>
    <text x="0" y="-45" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2D4436" text-anchor="middle">QUERCUS PUBESCENS</text>
  </g>

  <!-- Scale & Coordinates -->
  <g transform="translate(50, 725)">
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#141615">HORIZONTALSCHNITT A–A // 1:100 // GELÄNDEMODELL-SERIE 01</text>
  </g>
</svg>
