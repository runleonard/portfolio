    <text x="1290" y="215" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2B4234" stroke="none" letter-spacing="1">+435.0</text>
    <text x="1230" y="285" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2B4234" stroke="none" letter-spacing="1">+430.0</text>
    <text x="1170" y="355" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2B4234" stroke="none" letter-spacing="1">+425.0</text>
