    <path d="M 1500,440 L 1500,460 M 1490,450 L 1510,450" />

    <path d="M 300,740 L 300,760 M 290,750 L 310,750" />
    <path d="M 600,740 L 600,760 M 590,750 L 610,750" />
    <path d="M 900,740 L 900,760 M 890,750 L 910,750" />
