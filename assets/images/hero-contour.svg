      <polygon points="0,-15 -3,-5 0,-8 3,-5" fill="#2B4234" stroke="none" />
      <text x="-3" y="-20" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2B4234" stroke="none" font-weight="600">N</text>
