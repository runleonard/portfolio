    <text x="1050" y="495" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2B4234" stroke="none" letter-spacing="1">+415.0</text>
    <text x="990" y="565" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2B4234" stroke="none" letter-spacing="1">+410.0</text>
  </g>

  <!-- Feinste Vermessungs-Fadenkreuze (Surveyor Grid Crosshairs) -->
  <g opacity="0.06" stroke-width="0.75">
